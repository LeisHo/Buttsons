<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buttsons</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #14151a;
  }
  :root {
    --btn-w: 100;
    --btn-aspect: 1.02597;
    --array-scale: 1;
    --array-x-offset: 0;
    --array-y-offset: 0;
    --button-height: 18;
    --click-intensity: 14;
  }

  #arrayViewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  #arrayStage {
    position: absolute;
    left: 50%;
    top: 50%;
    will-change: transform;
  }

  .btn-cell {
    position: absolute;
    width: calc(var(--btn-w) * 1px);
    height: calc(var(--btn-w) * var(--btn-aspect) * 1px);
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .btn-cell svg { display: block; width: 100%; height: 100%; overflow: visible; }

  .dome-wrap {
    transform: translateY(calc(var(--button-height) * -1px));
  }
  .btn-cell.pressed .dome-wrap {
    transform: translateY(calc((var(--button-height) - var(--click-intensity)) * -1px));
  }

  .dome-pressed-use { visibility: hidden; }
  .btn-cell.pressed .dome-up-use { visibility: hidden; }
  .btn-cell.pressed .dome-pressed-use { visibility: visible; }

  /* ---- Dev panel ---- */
  #devPanel {
    display: none;
    position: fixed;
    top: 12px;
    right: 12px;
    width: 300px;
    max-height: 96vh;
    overflow-y: auto;
    background: rgba(15, 16, 20, 0.92);
    border: 1px solid #3a3d46;
    border-radius: 8px;
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    color: #e6e6e6;
    z-index: 1000;
  }
  body.dev-enabled #devPanel { display: block; }

  #devPanel h1 {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: 0.02em;
    color: #9fd3ff;
  }

  .dev-row { margin-bottom: 10px; }
  .dev-row label {
    display: block;
    margin-bottom: 3px;
    color: #b7bac2;
  }
  .dev-row-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dev-row input[type="range"] {
    flex: 1;
    accent-color: #5aa9ff;
  }
  .dev-value {
    min-width: 46px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: #fff;
    cursor: text;
    padding: 1px 4px;
    border-radius: 3px;
  }
  .dev-value:hover { background: rgba(255,255,255,0.08); }
  .dev-value input {
    width: 48px;
    background: #000;
    color: #fff;
    border: 1px solid #5aa9ff;
    border-radius: 3px;
    font-size: 12px;
    text-align: right;
  }

  .dev-actions {
    display: flex;
    gap: 6px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .dev-actions button {
    flex: 1;
    min-width: 80px;
    background: #262932;
    color: #e6e6e6;
    border: 1px solid #4a4e5a;
    border-radius: 5px;
    padding: 6px 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .dev-actions button:hover { background: #33374300; background: #33374a; }
  .dev-hint {
    margin-top: 8px;
    font-size: 10.5px;
    color: #7a7d85;
    line-height: 1.4;
  }
</style>
</head>

  function applyArrayTransform() {
    root.style.setProperty(ARRAY_SCALE_CSS, settings.arrayScale);
    stage.style.transform =
      "translate(-50%, -50%) translate(" + settings.xOffset + "px, " + settings.yOffset + "px) scale(" + settings.arrayScale + ")";
  }

  function regenerateGrid() {
    var cols = Math.max(1, Math.round(settings.colCount));
    var rows = Math.max(1, Math.round(settings.rowCount));
    var colSp = settings.colSpacing;
    var rowSp = settings.rowSpacing;
    var altOffset = settings.altRowXOffset;
    var basePad = Math.max(0, -altOffset);

    var totalW = (cols - 1) * colSp + 100 + Math.abs(altOffset);
    var totalH = (rows - 1) * rowSp + 100 * 1.02597;

    stage.style.width = totalW + "px";
    stage.style.height = totalH + "px";

    var parts = [];
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var x = basePad + c * colSp + (r % 2 === 1 ? altOffset : 0);
        var y = r * rowSp;
        parts.push(
          '<div class="btn-cell" style="left:' + x + 'px;top:' + y + 'px" data-r="' + r + '" data-c="' + c + '">' +
          '<svg viewBox="0 0 589.79 605.11" preserveAspectRatio="xMidYMid meet">' +
          '<use href="#sym-backing"></use>' +
          '<g class="dome-wrap">' +
          '<use class="dome-up-use" href="#sym-dome-up"></use>' +
          '<use class="dome-pressed-use" href="#sym-dome-pressed"></use>' +
          "</g>" +
          '<use href="#sym-base"></use>' +
          "</svg>" +
          "</div>"
        );
      }
    }
    stage.innerHTML = parts.join("");
    applyArrayTransform();
  }

  function applySetting(cfg, rawValue, opts) {
    opts = opts || {};
    var value = cfg.integer ? Math.round(rawValue) : rawValue;
    settings[cfg.key] = value;

    var slider = document.getElementById("slider-" + cfg.key);
    if (slider) slider.value = value;

    var valueEl = document.getElementById("value-" + cfg.key);
    if (valueEl && !valueEl.querySelector("input")) {
      valueEl.textContent = formatValue(cfg, value);
    }

    applyCssVar(cfg, value);

    if (cfg.key === "arrayScale" || cfg.key === "xOffset" || cfg.key === "yOffset") {
      applyArrayTransform();
    }
    if (cfg.regen && !opts.skipRegen) {
      regenerateGrid();
    }
  }

  function formatValue(cfg, value) {
    var v = cfg.integer ? Math.round(value) : Math.round(value * 100) / 100;
    return v + (cfg.unit || "");
  }

  function makeValueEditable(cfg, valueEl) {
    valueEl.addEventListener("click", function () {
      if (valueEl.querySelector("input")) return;
      var current = settings[cfg.key];
      valueEl.textContent = "";
      var input = document.createElement("input");
      input.type = "number";
      input.step = cfg.integer ? "1" : "any";
      input.value = current;
      valueEl.appendChild(input);
      input.focus();
      input.select();

      function commit() {
        var parsed = parseFloat(input.value);
        input.remove();
        if (!isNaN(parsed)) {
          applySetting(cfg, parsed);
        } else {
          valueEl.textContent = formatValue(cfg, settings[cfg.key]);
        }
      }

      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { commit(); }
        else if (e.key === "Escape") {
          input.remove();
          valueEl.textContent = formatValue(cfg, settings[cfg.key]);
        }
      });
      input.addEventListener("blur", commit);
    });
  }

  function buildSliders() {
    slidersHost.innerHTML = "";
    SLIDER_CONFIG.forEach(function (cfg) {
      var row = document.createElement("div");
      row.className = "dev-row";

      var label = document.createElement("label");
      label.textContent = cfg.label;
      row.appendChild(label);

      var controls = document.createElement("div");
      controls.className = "dev-row-controls";

      var slider = document.createElement("input");
      slider.type = "range";
      slider.id = "slider-" + cfg.key;
      slider.min = cfg.min;
      slider.max = cfg.max;
      slider.step = cfg.step;
      slider.value = settings[cfg.key];
      controls.appendChild(slider);

      var valueEl = document.createElement("span");
      valueEl.className = "dev-value";
      valueEl.id = "value-" + cfg.key;
      valueEl.textContent = formatValue(cfg, settings[cfg.key]);
      controls.appendChild(valueEl);

      row.appendChild(controls);
      slidersHost.appendChild(row);

      slider.addEventListener("input", function () {
        applySetting(cfg, parseFloat(slider.value));
      });

      makeValueEditable(cfg, valueEl);
    });
  }

  function applyAllSettings() {
    SLIDER_CONFIG.forEach(function (cfg) {
      applySetting(cfg, settings[cfg.key], { skipRegen: true });
    });
    regenerateGrid();
  }

  // ---- Press interaction (event delegation, multi-touch aware) ----
  var activePointers = new Map();

  function pressCell(cell) {
    if (cell.classList.contains("pressed")) return;
    var domeWrap = cell.querySelector(".dome-wrap");
    domeWrap.style.transition = "none";
    void domeWrap.offsetHeight; // force reflow so the transition:none takes effect before the class/transform change below
    cell.classList.add("pressed");
  }

  function releaseCell(cell) {
    if (!cell.classList.contains("pressed")) return;
    var domeWrap = cell.querySelector(".dome-wrap");
    domeWrap.style.transition = "transform " + settings.releaseMs + "ms ease-out";
    cell.classList.remove("pressed");
  }

  var viewport = document.getElementById("arrayViewport");

  viewport.addEventListener("pointerdown", function (e) {
    var cell = e.target.closest(".btn-cell");
    if (!cell) return;
    activePointers.set(e.pointerId, cell);
    try { cell.setPointerCapture(e.pointerId); } catch (err) {}
    pressCell(cell);
  });

  function handlePointerEnd(e) {
    var cell = activePointers.get(e.pointerId);
    if (!cell) return;
    activePointers.delete(e.pointerId);
    releaseCell(cell);
  }

  viewport.addEventListener("pointerup", handlePointerEnd);
  viewport.addEventListener("pointercancel", handlePointerEnd);
  viewport.addEventListener("pointerleave", function (e) {
    if (e.target === viewport) return;
  });

  // ---- Dev panel actions ----
  function flashButton(btn, text) {
    var original = btn.textContent;
    btn.textContent = text;
    setTimeout(function () { btn.textContent = original; }, 900);
  }

  document.getElementById("btnCopy").addEventListener("click", function () {
    var btn = this;
    var json = JSON.stringify(settings, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(function () {
        flashButton(btn, "Copied!");
      }, function () {
        fallbackCopy(json, btn);
      });
    } else {
      fallbackCopy(json, btn);
    }
  });

  function fallbackCopy(text, btn) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand("copy");
      flashButton(btn, "Copied!");
    } catch (e) {
      flashButton(btn, "Copy failed");
    }
    document.body.removeChild(ta);
  }

  document.getElementById("btnSave").addEventListener("click", function () {
    var btn = this;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
      savedDefaults = Object.assign({}, settings);
      flashButton(btn, "Saved!");
    } catch (e) {
      flashButton(btn, "Save failed");
    }
  });

  document.getElementById("btnReset").addEventListener("click", function () {
    settings = Object.assign({}, savedDefaults);
    buildSliders();
    applyAllSettings();
  });

  // ---- Init ----
  if (isDevAllowed()) {
    document.body.classList.add("dev-enabled");
  }
  buildSliders();
  applyAllSettings();
})();
</script>
</body>
</html>
